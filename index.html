<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>留言板</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Segoe UI", sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 600px;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      padding: 24px;
      border-radius: 12px;
      margin-bottom: 20px;
      text-align: center;
    }
    .header h1 { font-size: 22px; margin-bottom: 6px; }
    .header p { font-size: 13px; opacity: 0.85; }

    .post-area {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .post-area textarea {
      width: 100%;
      height: 80px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      resize: vertical;
      outline: none;
      font-family: inherit;
    }
    .post-area textarea:focus { border-color: #667eea; }
    .post-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }
    .nickname-input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      margin-right: 10px;
    }
    .nickname-input:focus { border-color: #667eea; }
    .post-btn {
      padding: 8px 20px;
      background: #667eea;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }
    .post-btn:hover { background: #5a6fd6; }
    .post-btn:disabled { background: #ccc; cursor: not-allowed; }

    .messages {
      background: #fff;
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .msg {
      padding: 14px;
      border-bottom: 1px solid #f0f0f0;
    }
    .msg:last-child { border-bottom: none; }
    .msg-top {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .msg-name {
      font-weight: 600;
      color: #667eea;
      font-size: 14px;
    }
    .msg-time {
      color: #999;
      font-size: 12px;
    }
    .msg-content {
      color: #333;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .empty {
      text-align: center;
      color: #999;
      padding: 40px 20px;
      font-size: 14px;
    }
    .refresh-btn {
      display: block;
      width: 100%;
      padding: 10px;
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 8px;
      color: #666;
      font-size: 13px;
      cursor: pointer;
      margin-top: 12px;
    }
    .refresh-btn:hover { background: #e9ecef; }
    .error-hint {
      background: #fff3cd;
      border: 1px solid #ffc107;
      padding: 12px;
      border-radius: 8px;
      font-size: 12px;
      color: #856404;
      margin-bottom: 16px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>💬 留言板</h1>
      <p>给对方留句话吧</p>
    </div>

    <div class="post-area">
      <textarea id="msgInput" placeholder="写点什么..."></textarea>
      <div class="post-row">
        <input id="nickInput" class="nickname-input" placeholder="你的昵称" value="">
        <button class="post-btn" id="postBtn" onclick="postMessage()">留言</button>
      </div>
    </div>

    <div class="messages" id="messages">
      <div class="empty">加载中...</div>
    </div>
    <button class="refresh-btn" onclick="loadMessages()">🔄 刷新留言</button>
  </div>

  <script>
    // ============================================================
    // ⚠️ 配置区：把下面 4 个值改成你自己的，然后重新上传到 GitHub
    // ============================================================
    var CONFIG = {
      token: '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',              // ⚠️ 填你的 Token（ghp_ 开头）
      owner: '7770748737',    // ✅ 已填好
      repo: '22222',          // ✅ 已填好
      issueNum: '1'            // ⚠️ 填你的 Issue 编号（比如 1）
    };
    // ============================================================

    async function loadMessages() {
      if (!CONFIG.token || !CONFIG.owner || !CONFIG.repo || !CONFIG.issueNum) {
        document.getElementById('messages').innerHTML =
          '<div class="empty">⚠️ 网站还没配置好<br><br>' +
          '请修改 index.html 里的 CONFIG 配置区<br>' +
          '填入 token / owner / repo / issueNum</div>';
        return;
      }
      var messagesEl = document.getElementById('messages');
      messagesEl.innerHTML = '<div class="empty">加载中...</div>';
      try {
        var resp = await fetch(
          'https://api.github.com/repos/' + CONFIG.owner + '/' + CONFIG.repo +
          '/issues/' + CONFIG.issueNum + '/comments',
          { headers: { Authorization: 'token ' + CONFIG.token } }
        );
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        var comments = await resp.json();
        if (comments.length === 0) {
          messagesEl.innerHTML = '<div class="empty">还没有留言，快来抢沙发 🛋️</div>';
          return;
        }
        messagesEl.innerHTML = comments.map(function(c) {
          var body = c.body || '';
          var name = '匿名';
          var text = body;
          var nickMatch = body.match(/^【([^】]+)】/);
          if (nickMatch) {
            name = nickMatch[1];
            text = body.substring(nickMatch[0].length);
          }
          var time = new Date(c.created_at);
          var timeStr = time.toLocaleString('zh-CN');
          return '<div class="msg">' +
            '<div class="msg-top">' +
              '<span class="msg-name">' + escapeHtml(name) + '</span>' +
              '<span class="msg-time">' + timeStr + '</span>' +
            '</div>' +
            '<div class="msg-content">' + escapeHtml(text) + '</div>' +
          '</div>';
        }).join('');
      } catch(e) {
        messagesEl.innerHTML = '<div class="empty">❌ 加载失败：' + e.message + '</div>';
      }
    }

    async function postMessage() {
      if (!CONFIG.token || !CONFIG.owner || !CONFIG.repo || !CONFIG.issueNum) {
        alert('网站还没配置好，请先修改 index.html 里的 CONFIG 配置区');
        return;
      }
      var input = document.getElementById('msgInput');
      var nick = document.getElementById('nickInput');
      var text = input.value.trim();
      var nickname = nick.value.trim() || '匿名';
      if (!text) { alert('留言内容不能为空'); return; }

      var btn = document.getElementById('postBtn');
      btn.disabled = true;
      btn.textContent = '发送中...';

      try {
        var body = '【' + nickname + '】' + text;
        var resp = await fetch(
          'https://api.github.com/repos/' + CONFIG.owner + '/' + CONFIG.repo +
          '/issues/' + CONFIG.issueNum + '/comments',
          {
            method: 'POST',
            headers: {
              Authorization: 'token ' + CONFIG.token,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ body: body })
          }
        );
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        input.value = '';
        loadMessages();
      } catch(e) {
        alert('留言失败：' + e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = '留言';
      }
    }

    function escapeHtml(text) {
      var div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    loadMessages();
  </script>
</body>
</html>
